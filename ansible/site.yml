---
- name: Configure Municipal Complaint Portal host prerequisites
  hosts: municipal_portal
  become: true
  gather_facts: true

  vars:
    portal_backend_host: "127.0.0.1"
    portal_backend_port: 8085
    portal_public_port: 8090
    portal_server_name: "_"
    portal_service_user: "portal-deploy"
    portal_service_group: "municipal-portal"
    portal_deploy_root: "/opt/municipal-portal"
    portal_state_dir: "/var/lib/municipal-portal"
    portal_log_dir: "/var/log/municipal-portal"
    portal_config_dir: "/etc/municipal-portal"

  pre_tasks:
    - name: Require a supported Debian-family target
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Ubuntu", "Debian"]
        fail_msg: >-
          This playbook uses APT and supports Ubuntu or Debian targets only.

    - name: Validate the configured TCP ports
      ansible.builtin.assert:
        that:
          - portal_backend_port | int > 0
          - portal_backend_port | int < 65536
          - portal_public_port | int > 0
          - portal_public_port | int < 65536
          - portal_backend_port | int != portal_public_port | int
        fail_msg: "Backend and public ports must be valid, distinct TCP ports."

  tasks:
    - name: Refresh the APT package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install portal host prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - nginx
          - python3-docker
          - python3
          - python3-apt
        state: present

    - name: Create the portal deployment group
      ansible.builtin.group:
        name: "{{ portal_service_group }}"
        system: true
        state: present

    - name: Create a locked, non-interactive deployment account
      ansible.builtin.user:
        name: "{{ portal_service_user }}"
        group: "{{ portal_service_group }}"
        system: true
        create_home: false
        home: "/nonexistent"
        shell: "/usr/sbin/nologin"
        password: "!"
        state: present

    - name: Create deployment, state, log, and configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ portal_deploy_root }}"
          owner: "{{ portal_service_user }}"
          group: "{{ portal_service_group }}"
          mode: "0750"
        - path: "{{ portal_deploy_root }}/releases"
          owner: "{{ portal_service_user }}"
          group: "{{ portal_service_group }}"
          mode: "0750"
        - path: "{{ portal_state_dir }}"
          owner: "{{ portal_service_user }}"
          group: "{{ portal_service_group }}"
          mode: "0750"
        - path: "{{ portal_log_dir }}"
          owner: "{{ portal_service_user }}"
          group: "{{ portal_service_group }}"
          mode: "0750"
        - path: "{{ portal_config_dir }}"
          owner: "root"
          group: "{{ portal_service_group }}"
          mode: "0750"

    - name: Install the non-secret portal runtime environment file
      ansible.builtin.template:
        src: "templates/portal.env.j2"
        dest: "{{ portal_config_dir }}/portal.env"
        owner: "root"
        group: "{{ portal_service_group }}"
        mode: "0640"

    - name: Install the Nginx reverse-proxy site
      ansible.builtin.template:
        src: "templates/municipal-complaint-portal.conf.j2"
        dest: "/etc/nginx/conf.d/municipal-complaint-portal.conf"
        owner: "root"
        group: "root"
        mode: "0644"
      notify: Reload Nginx

    - name: Validate the complete Nginx configuration before starting services
      ansible.builtin.command: /usr/sbin/nginx -t
      changed_when: false

    - name: Enable and start the Docker and Nginx services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - nginx

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
